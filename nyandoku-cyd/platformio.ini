; にゃんドク for ESP32-2432S028R (Cheap Yellow Display)
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen

; TFT_eSPI の User_Setup.h を使わず、ここでピン設定を完結させる
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1          ; 一般的なCYD。USB-C版(ST7789)は下の注意を参照
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
 ;   -DFORCE_CAL=1                 ; 毎回起動時に校正する(動作確認後は行頭に ; を付けて無効化)
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    ; --- 画面の色が反転する/おかしい場合は以下を試す ---
    ; -DTFT_INVERSION_ON=1
    ; -DTFT_RGB_ORDER=TFT_BGR
    ; --- USB-C版(ST7789ドライバ)の場合は ILI9341_2_DRIVER を外して: ---
    ; -DST7789_DRIVER=1 -DTFT_INVERSION_ON=1
