<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>にゃんドク – ネコ配置パズル</title>
<style>
:root{--bg:#fff4e6;--card:#fff;--ink:#4a3426;--sub:#9a7f6b;--line:#4a3426;--btn:#ffb457;--btnink:#4a2b0b;--l:80%;--err:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#221a14;--card:#2f241c;--ink:#f5e6d6;--sub:#b39b86;--line:#f5e6d6;--btn:#e59a3d;--btnink:#2a1706;--l:36%;--err:#ff6b70}}
:root[data-theme="dark"]{--bg:#221a14;--card:#2f241c;--ink:#f5e6d6;--sub:#b39b86;--line:#f5e6d6;--btn:#e59a3d;--btnink:#2a1706;--l:36%;--err:#ff6b70}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:14px 12px 24px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:1.5rem;text-align:center}
.bar,.tools{display:flex;gap:8px;justify-content:space-between;align-items:center}
.tools button{flex:1}
select,button{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:7px 10px;cursor:pointer}
.stats{display:flex;justify-content:space-around;color:var(--sub)}
#board{display:grid;width:100%;aspect-ratio:1;border:3px solid var(--line);border-radius:8px;overflow:hidden;user-select:none;touch-action:manipulation}
.c{display:flex;align-items:center;justify-content:center;font-size:clamp(1.3rem,8vw,2.4rem);cursor:pointer;border:0 solid var(--line);position:relative}
.c.err{box-shadow:inset 0 0 0 100px color-mix(in srgb,var(--err) 45%,transparent);animation:sh .3s}
.c .x{font-size:.5em;color:var(--ink);opacity:.45}
@keyframes sh{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.rules{background:var(--card);border-radius:14px;padding:10px 14px;font-size:.88rem;line-height:1.6}
.rules b{display:block;margin-bottom:2px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
#modal div{background:var(--card);border-radius:20px;padding:26px;text-align:center;max-width:320px}
#modal .big{font-size:3.4rem}
#modal button{background:var(--btn);color:var(--btnink);border-color:var(--btn);margin-top:12px;font-weight:700}
</style>
</head>
<body>
<main>
<h1>🐾 にゃんドク 🐾</h1>
<div class="bar">
<select id="size"><option value="5">5×5</option><option value="6">6×6</option><option value="7" selected>7×7</option><option value="8">8×8</option><option value="9">9×9</option></select>
<button id="new">🐱 新しいゲーム</button>
</div>
<div class="stats"><span>⏱ <b id="time">0:00</b></span><span>🐱 <b id="cnt">0</b> / <b id="tot">0</b></span></div>
<div id="board"></div>
<div class="tools"><button id="undo">↩️ 戻す</button><button id="hint">💡 ヒント</button><button id="clear">🧹 リセット</button></div>
<div class="rules"><b>あそびかた</b>
① 色分けされた各エリアに猫を1匹だけ置く<br>
② 各行・各列にも猫は1匹ずつ<br>
③ 猫同士は隣り合わせ(斜めも)にしない<br>
<span style="color:var(--sub)">タップで ✕(メモ)→ 🐱 → 空 の順に切り替わります。</span></div>
</main>
<div id="modal"><div><div class="big">😻</div><h2>クリア！</h2><p id="res"></p><button id="again">もう一度あそぶ</button></div></div>
<script>
const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let N,reg,sol,st,hist,sec,over,timer;
function place(){const p=[];const used=new Set();
(function go(r){if(r===N)return true;for(const c of shuffle([...Array(N).keys()])){if(used.has(c)||(r&&Math.abs(c-p[r-1])<2))continue;p[r]=c;used.add(c);if(go(r+1))return true;used.delete(c)}return false})(0);return p}
function grow(p){const g=new Array(N*N).fill(-1);p.forEach((c,r)=>g[r*N+c]=r);let left=N*N-N;
const nb=i=>{const r=i/N|0,c=i%N,o=[];if(r>0)o.push(i-N);if(r<N-1)o.push(i+N);if(c>0)o.push(i-1);if(c<N-1)o.push(i+1);return o};
while(left>0){const fr=[];for(let i=0;i<N*N;i++)if(g[i]<0){const a=nb(i).filter(k=>g[k]>=0);if(a.length)fr.push([i,a])}
const [i,a]=fr[Math.random()*fr.length|0];g[i]=g[a[Math.random()*a.length|0]];left--}return g}
function count(g){let n=0;const cols=new Set(),rg=new Set();
(function go(r,prev){if(n>1)return;if(r===N){n++;return}for(let c=0;c<N;c++){if(cols.has(c)||(r&&Math.abs(c-prev)<2))continue;const k=g[r*N+c];if(rg.has(k))continue;cols.add(c);rg.add(k);go(r+1,c);cols.delete(c);rg.delete(k)}})(0,-9);return n}
function gen(){let g,p;for(let t=0;t<3000;t++){p=place();g=grow(p);if(count(g)===1)break}return{g,p}}
function start(){N=+$('size').value;const {g,p}=gen();reg=g;sol=new Set(p.map((c,r)=>r*N+c));st=new Array(N*N).fill(0);hist=[];sec=0;over=false;
$('modal').classList.remove('show');$('tot').textContent=N;$('time').textContent='0:00';
clearInterval(timer);timer=setInterval(()=>{if(!over){sec++;$('time').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}},1000);
const b=$('board');b.style.gridTemplateColumns=`repeat(${N},1fr)`;b.innerHTML='';
for(let i=0;i<N*N;i++){const d=document.createElement('div');d.className='c';const r=i/N|0,c=i%N,R=reg[i],w='3px',t='1px';
const s=(ok,cond)=>cond?t:w;
d.style.background=`hsl(${R*(360/N)+10} 65% var(--l))`;
d.style.borderTopWidth=r===0?0:(reg[i-N]===R?t:w);d.style.borderLeftWidth=c===0?0:(reg[i-1]===R?t:w);
d.style.borderTopColor=d.style.borderLeftColor=reg[i-N]===R||reg[i-1]===R?'color-mix(in srgb,var(--line) 25%,transparent)':'var(--line)';
d.onclick=()=>tap(i);b.appendChild(d)}
paint()}
function conflicts(){const cats=[];st.forEach((v,i)=>{if(v===2)cats.push(i)});const bad=new Set();
for(const a of cats)for(const b of cats){if(a>=b)continue;const ra=a/N|0,ca=a%N,rb=b/N|0,cb=b%N;
if(ra===rb||ca===cb||reg[a]===reg[b]||Math.max(Math.abs(ra-rb),Math.abs(ca-cb))===1){bad.add(a);bad.add(b)}}return{cats,bad}}
function paint(){const {cats,bad}=conflicts();const cells=$('board').children;
for(let i=0;i<N*N;i++){const d=cells[i];d.className='c'+(bad.has(i)?' err':'');d.innerHTML=st[i]===2?'🐱':st[i]===1?'<span class="x">✕</span>':''}
$('cnt').textContent=cats.length;
if(!over&&cats.length===N&&!bad.size){over=true;clearInterval(timer);$('res').textContent=`タイム ${Math.floor(sec/60)}分${sec%60}秒`;setTimeout(()=>$('modal').classList.add('show'),500)}}
function tap(i){if(over)return;hist.push(st.slice());st[i]=(st[i]+1)%3;paint()}
$('undo').onclick=()=>{if(over||!hist.length)return;st=hist.pop();paint()};
$('clear').onclick=()=>{if(over)return;hist.push(st.slice());st.fill(0);paint()};
$('hint').onclick=()=>{if(over)return;const w=[...sol].filter(i=>st[i]!==2);if(!w.length)return;hist.push(st.slice());
st.forEach((v,i)=>{if(v===2&&!sol.has(i))st[i]=0});const i=w[Math.random()*w.length|0];st[i]=2;paint()};
$('new').onclick=start;$('again').onclick=start;$('size').onchange=start;
start();
</script>
</body>
</html>
